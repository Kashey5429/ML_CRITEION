server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;
    location /api/ { proxy_pass $api$request_uri; proxy_set_header Host $host; }
    location /health/ { proxy_pass $api$request_uri; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

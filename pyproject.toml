[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ml-criterion"
version = "0.1.0"
description = "Reproducible MADlib and scikit-learn benchmark control plane"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2.6,<4", "psutil>=7,<8",
  "numpy>=2.2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2",
  "threadpoolctl>=3.6,<4",
]

[project.scripts]
ml-criterion = "ml_criterion.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
